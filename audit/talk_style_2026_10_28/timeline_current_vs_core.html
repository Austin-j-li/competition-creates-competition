<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where the minutes go: current deck against the proposed 30-minute core</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #6f6e69;
  --grid: #e4e3df;
  --buffer: #d9d8d3;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
  --marker: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9c9b93;
    --grid: #33322f; --buffer: #4a4945;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
    --marker: #f0efec;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9c9b93;
  --grid: #33322f; --buffer: #4a4945;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
  --marker: #f0efec;
}
html, body { margin: 0; }
.viz-root { background: var(--surface-1); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 24px 28px; max-width: 980px; }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--text-secondary); margin: 0 0 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; color: var(--text-secondary); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
svg text { fill: var(--text-secondary); font-size: 12px; }
svg .rowlab { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
svg .seglab { fill: var(--text-primary); font-size: 11.5px; }
svg .mlab { fill: var(--text-primary); font-size: 11.5px; }
svg .tick { stroke: var(--grid); stroke-width: 1; }
.seg { stroke: var(--surface-1); stroke-width: 2; }
.seg:hover { opacity: .85; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; max-width: 300px; }
details { margin-top: 12px; color: var(--text-secondary); }
table { border-collapse: collapse; margin-top: 6px; font-size: 13px; }
th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--grid); }
th { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div class="viz-root">
  <h1>Where the minutes go in a 45-minute slot</h1>
  <p class="sub">Current deck (timing lock in the verbatim pack) against the proposed 30-minute core. Triangles mark when the model, Proposition 2 and the first example numbers reach the screen. In the core, a symbolic two-fit example starts with the model.</p>
  <div class="legend" id="legend"></div>
  <svg id="chart" viewBox="0 0 940 300" width="100%" role="img" aria-label="Two horizontal timelines of 45 minutes"></svg>
  <details><summary>Table view</summary><table id="tbl"></table></details>
  <div id="tip"></div>
</div>
<script>
const parts = [
  {key:'mot', name:'Question and literature', c:'--series-1'},
  {key:'mod', name:'Model', c:'--series-2'},
  {key:'mec', name:'Mechanism (Prop. 1, band, bound)', c:'--series-3'},
  {key:'res', name:'Main result, example, control', c:'--series-4'},
  {key:'ext', name:'Coexistence, research', c:'--series-5'},
  {key:'end', name:'Scope, welfare, tests, close', c:'--series-6'},
  {key:'buf', name:'Questions, or optional modules', c:'--buffer'}
];
const rows = [
  {label:'Current deck', segs:[
    ['mot',0,8.5,'Title, S1–S4 (literature table on S3)'],
    ['mod',8.5,17.5,'S5–S9'],
    ['mec',17.5,24.5,'S10–S13'],
    ['res',24.5,33,'S14–S18'],
    ['ext',33,39.5,'S19–S22'],
    ['end',39.5,45,'S23–S26']],
   marks:[[8.5,'Model'],[24.5,'Prop. 2'],[28,'First example']]},
  {label:'Proposed core', segs:[
    ['mot',0,2.5,'Title, question and answer'],
    ['mod',2.5,9.5,'Setting, players and timeline, who knows/chooses/gets, equilibrium'],
    ['mec',9.5,14,'Prop. 1 with the two-fit number line; one order can point, not prove'],
    ['res',14,22,'Prop. 2; why unique (two bounds); example figure; fixed-information control'],
    ['mot',22,23,'Literature: three grouped lines, two names aloud'],
    ['end',23,25.5,'Tests; conclusion'],
    ['buf',25.5,30,'Questions during the talk'],
    ['buf',30,45,'Questions, or optional modules: coexistence 3, research 3, scope 1.5, access 2']],
   marks:[[2.5,'Model'],[14,'Prop. 2'],[18,'Example numbers']]}
];
const css = getComputedStyle(document.querySelector('.viz-root'));
const col = v => css.getPropertyValue(v).trim();
const L = 130, R = 920, W = R - L, x = m => L + W * m / 45;
const svg = document.getElementById('chart'), NS = 'http://www.w3.org/2000/svg';
const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; svg.appendChild(e); return e; };
for (let m = 0; m <= 45; m += 5) { el('line', {x1:x(m), x2:x(m), y1:30, y2:262, class:'tick'}); el('text', {x:x(m), y:282, 'text-anchor': m===45 ? 'end' : 'middle'}, m + (m===45?' min':'')); }
el('line', {x1:x(30), x2:x(30), y1:24, y2:262, stroke:col('--text-muted'), 'stroke-dasharray':'4 3', 'stroke-width':1.5});
el('text', {x:x(30)+4, y:22, 'text-anchor':'start'}, '30-minute target');
const tip = document.getElementById('tip');
rows.forEach((r, i) => {
  const y = 62 + i * 112, h = 34;
  el('text', {x:L-12, y:y+h/2+4, 'text-anchor':'end', class:'rowlab'}, r.label);
  r.segs.forEach(s => {
    const p = parts.find(q => q.key === s[0]);
    const rect = el('rect', {x:x(s[1]), y, width:x(s[2])-x(s[1]), height:h, rx:4, fill:col(p.c), class:'seg'});
    rect.addEventListener('mousemove', e => { tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
      tip.innerHTML = `<b>${p.name}</b><br>${s[1]}–${s[2]} min (${(s[2]-s[1]).toFixed(1)})<br>${s[3]}`; });
    rect.addEventListener('mouseleave', () => tip.style.display='none');
  });
  r.marks.forEach((mk, j) => {
    const mx = x(mk[0]);
    el('path', {d:`M${mx-6},${y+h+16} L${mx+6},${y+h+16} L${mx},${y+h+5} Z`, fill:col('--marker')});
    el('text', {x: mk[0] < 5 ? mx-6 : mx, y:y+h+30 + (j%2)*15, 'text-anchor': mk[0] < 5 ? 'start' : 'middle', class:'mlab'}, `${mk[1]} · ${mk[0]}`);
  });
});
const lg = document.getElementById('legend');
parts.forEach(p => { lg.insertAdjacentHTML('beforeend', `<span><i style="background:${col(p.c)}"></i>${p.name}</span>`); });
const tbl = document.getElementById('tbl');
tbl.innerHTML = '<tr><th>Version</th><th>Part</th><th>Minutes</th><th>Content</th></tr>' +
  rows.flatMap(r => r.segs.map(s => `<tr><td>${r.label}</td><td>${parts.find(q=>q.key===s[0]).name}</td><td>${s[1]}–${s[2]}</td><td>${s[3]}</td></tr>`)).join('');
</script>
</body>
</html>
