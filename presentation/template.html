<script>
(function () {
  try {
    var q = new URLSearchParams(window.location.search).get("theme"), stored = null;
    try {
      stored = window.localStorage.getItem("ccc-theme");
      // The slides once kept their own key; one key now serves the handout and the slides.
      var old = window.localStorage.getItem("ccc-deck-theme");
      if (old !== null) {
        if (stored === null && (old === "light" || old === "dark")) { stored = old; window.localStorage.setItem("ccc-theme", old); }
        window.localStorage.removeItem("ccc-deck-theme");
      }
    } catch (e) { stored = null; }
    var theme = (q === "light" || q === "dark") ? q : (stored === "light" || stored === "dark") ? stored : "light";
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
