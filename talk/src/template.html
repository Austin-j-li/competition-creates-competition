<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competition Creates Competition</title>
{{KATEX_CSS}}
{{TOKENS_CSS}}
{{STAGE_CSS}}
{{FIGS_CSS}}
{{LOOKS_CSS}}
</head>
<body data-look="plate" data-motion="on">
<div id="viewport">
  <div id="stage">
    <div id="deck">
{{PAGES}}
    </div>
    <div id="carry" aria-hidden="true"></div>
  </div>
</div>
<div id="blank" aria-hidden="true"></div>
<div id="overview" role="dialog" aria-modal="true" aria-label="Overview" hidden></div>
<div id="hud" role="toolbar" aria-label="Talk controls">
  <button type="button" data-act="prev" aria-label="Previous"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
  <button type="button" data-act="next" aria-label="Next"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
  <button type="button" data-act="overview" aria-label="Overview (O)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg></button>
  <button type="button" data-act="read" aria-label="Reading view (V)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 6h11M4.5 10h11M4.5 14h7"/></svg></button>
</div>
<div id="keys" aria-live="polite"></div>
{{DATA}}
{{MATH}}
{{BOOT}}
{{ENGINE_JS}}
{{FIG_JS}}
{{LOOK_JS}}
<script>TALK.start();</script>
</body>
</html>
