<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competition Creates Competition</title>
{{KATEX_CSS}}
{{TOKENS_CSS}}
{{STAGE_CSS}}
{{FIGS_CSS}}
{{LOOKS_CSS}}
</head>
<body data-look="plate" data-motion="on">
<p class="read-hint">Turn the phone sideways for larger pages.</p>
<div id="viewport">
  <div id="stage">
    <div id="deck">
{{PAGES}}
    </div>
    <div id="carry" aria-hidden="true"></div>
  </div>
</div>
<div id="blank" aria-hidden="true"></div>
<div id="overview" role="dialog" aria-modal="true" aria-label="Overview" hidden></div>
<header id="hud" aria-label="Talk controls">
  <a class="hud-home" href="../">Competition Creates Competition</a>
  <div class="hud-acts" role="toolbar" aria-label="Talk controls">
    <span class="hud-pos"></span>
    <button type="button" class="hud-return" data-act="return" hidden><span class="tri tri-l" aria-hidden="true"></span><span class="hud-return-label">Back</span></button>
    <button type="button" class="hud-strength" data-act="strength" aria-pressed="false" aria-keyshortcuts="S" hidden><span>Strength</span><kbd>S</kbd></button>
    <button type="button" class="hud-step" data-act="prev" aria-label="Previous" title="Previous (Left)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
    <button type="button" class="hud-step" data-act="next" aria-label="Next" title="Next (Right or Space)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
    <button type="button" data-act="overview" aria-keyshortcuts="O"><span>Overview</span><kbd>O</kbd></button>
    <button type="button" data-act="notation" aria-keyshortcuts="G"><span>Notation</span><kbd>G</kbd></button>
    <button type="button" data-act="read" aria-keyshortcuts="V"><span class="hud-read">Reading view</span><kbd>V</kbd></button>
    <button type="button" data-act="full" aria-keyshortcuts="F"><span class="hud-full">Full screen</span><kbd>F</kbd></button>
    <button type="button" data-act="keys" aria-keyshortcuts="?"><span>Keys</span><kbd>?</kbd></button>
  </div>
</header>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="sheet-close">Close <kbd>Esc</kbd></button></div>
  <div class="sheet-body"></div>
</div>
<div id="keys" aria-live="polite"></div>
<noscript><p class="noscript">The talk needs JavaScript to step through its pages. The slides are also <a href="talk.pdf">a PDF</a>.</p></noscript>
{{DATA}}
{{MATH}}
{{BOOT}}
{{ENGINE_JS}}
{{FIG_JS}}
{{LOOK_JS}}
<script>TALK.start();</script>
</body>
</html>
